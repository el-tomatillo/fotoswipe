name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk FotoSwipe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FotoSwipe
          path: FotoSwipe.apk
      - name: Publish APK to apk branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf --cached . > /dev/null
          git add -f FotoSwipe.apk
          git commit -m "APK build ${{ github.run_number }}"
          git push -f origin apk
